<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">PD-002 Indra Festival Public-Space Map</title>
  <desc id="desc">Interpretive civic-space and screen-movement map for the twenty-eight-day festival. Not a reconstructed ritual itinerary or exact city plan.</desc>
  <defs><style>
    .bg{fill:#10232b}.zone{fill:#183541;stroke:#76909a;stroke-width:2}.route{fill:none;stroke:#e4b96a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16 10}.counter{fill:none;stroke:#cf7c69;stroke-width:5;stroke-linecap:round}.water{fill:none;stroke:#63a9bd;stroke-width:5}.title{font:700 34px Arial,sans-serif;fill:#f2e4be}.head{font:700 21px Arial,sans-serif;fill:#f2e4be}.body{font:16px Arial,sans-serif;fill:#d8e2df}.small{font:14px Arial,sans-serif;fill:#acc1c5}.warn{font:700 19px Arial,sans-serif;fill:#e5a46b}.code{font:700 18px Arial,sans-serif;fill:#fff}.badge{fill:#356373}
  </style></defs>
  <rect width="1600" height="1050" class="bg"/>
  <text x="60" y="58" class="title">PD-002 · INDRA FESTIVAL PUBLIC-SPACE MAP 0.1</text>
  <text x="60" y="91" class="warn">[INTERPRETATION] · NOT A RECONSTRUCTED RITUAL ITINERARY · SR-003 / SR-006 OPEN</text>
  <text x="60" y="120" class="body">Twenty-eight-day civic-sacral gathering. No automatic later iconography, temple procession or uniform theology.</text>

  <rect x="55" y="150" width="1490" height="720" rx="14" fill="#132b35" stroke="#5d7882" stroke-width="2"/>
  <path d="M75 270 Q180 235 285 270 T500 270" class="water"/>
  <rect x="90" y="185" width="360" height="145" rx="14" class="zone"/><text x="115" y="220" class="head">F1 · RIVER / HARBOUR LABOUR</text><text x="115" y="250" class="body">supply · cargo · sediment · fatigue</text><text x="115" y="300" class="small">Counter: abundance does not reach everyone</text>
  <rect x="500" y="175" width="330" height="155" rx="14" class="zone"/><text x="525" y="210" class="head">F2 · RENEWAL STREETS</text><text x="525" y="240" class="body">old sand out · fresh sand in</text><text x="525" y="270" class="body">cleaners and carriers remain visible</text>
  <rect x="885" y="175" width="600" height="155" rx="14" class="zone"/><text x="910" y="210" class="head">F3 · ROYAL-CIVIC PROCLAMATION ROUTE</text><text x="910" y="240" class="body">drum · herald · officers · public obligation</text><text x="910" y="285" class="small">Authority = responsibility, not divine ownership</text>

  <rect x="90" y="385" width="330" height="170" rx="14" class="zone"/><text x="115" y="420" class="head">F4 · MARKET / MERCHANT</text><text x="115" y="450" class="body">visitors · exchange · food · repair</text><text x="115" y="500" class="small">Counter: price, access, hidden scarcity</text>
  <rect x="470" y="385" width="330" height="170" rx="14" class="zone"/><text x="495" y="420" class="head">F5 · ANIMAL CORRIDOR</text><text x="495" y="450" class="body">handlers · shade · rest · escape route</text><text x="495" y="500" class="small">Ceremony never overrides welfare</text>
  <rect x="850" y="385" width="635" height="170" rx="14" class="zone"/><text x="875" y="420" class="head">F6 · DEBATE / TEACHING COURT</text><text x="875" y="450" class="body">plural teachers · audiences · regulated disagreement</text><text x="875" y="500" class="small">No modern panel format; no one uniform religious identity</text>

  <rect x="90" y="610" width="400" height="175" rx="14" class="zone"/><text x="115" y="645" class="head">F7 · PERFORMANCE / REHEARSAL</text><text x="115" y="675" class="body">artists · teachers · musicians · workers</text><text x="115" y="725" class="small">Counter: Madhavi's absent household</text>
  <rect x="545" y="610" width="400" height="175" rx="14" class="zone"/><text x="570" y="645" class="head">F8 · HOUSEHOLD THRESHOLDS</text><text x="570" y="675" class="body">lamps · leaves · flowers · alms · grief</text><text x="570" y="725" class="small">Unequal capacity; private refusal remains possible</text>
  <rect x="1000" y="610" width="485" height="175" rx="14" class="zone"/><text x="1025" y="645" class="head">F9 · MARGINAL / CARE EDGE</text><text x="1025" y="675" class="body">hunger · exclusion · ordinary care</text><text x="1025" y="725" class="small">The festival's moral contradiction stays on screen</text>

  <path d="M275 330 C350 350 500 345 630 330 S960 340 1080 330 C1120 350 1100 385 1000 420 C830 480 710 515 665 555 C620 595 690 620 760 610 C890 590 1040 560 1160 555 C1260 550 1300 600 1240 610" class="route"/>
  <path d="M280 785 C440 835 760 850 1245 785" class="counter"/>
  <text x="112" y="840" class="small">P0–P5: labour → proclamation → renewal → plurality → ceremony → household absence</text>
  <text x="975" y="840" class="small">P6 counter-route: visible abundance → hidden hunger</text>

  <rect x="55" y="895" width="1490" height="105" rx="12" class="zone"/>
  <text x="80" y="930" class="head">BINDING PROHIBITIONS</text>
  <text x="80" y="960" class="body">later calendar-art Indra · massive medieval temple centre · uniform “Hindu festival” · fantasy celestial spectacle</text>
  <text x="80" y="988" class="body">modern interfaith panel · distressed ceremonial animals · route claimed as exact Puhar geography</text>
  <text x="1380" y="1025" class="small">PD-002 / MAP 0.1</text>
</svg>
