<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PD-005 Costume Layer and Movement Board</title><desc id="desc">Interpretive costume layer and movement controls. Not exact Sangam dress.</desc>
  <defs><style>.bg{fill:#17222a}.panel{fill:#26353d;stroke:#82939a;stroke-width:2}.title{font:700 34px Arial;fill:#f2e5c1}.head{font:700 22px Arial;fill:#f2e5c1}.body{font:16px Arial;fill:#dce3df}.warn{font:700 19px Arial;fill:#e2a16c}.line{fill:none;stroke:#ddca9d;stroke-width:4}.accent{fill:#526f78}.code{font:700 16px Arial;fill:#fff}.small{font:14px Arial;fill:#afbec1}</style></defs>
  <rect width="1600" height="1000" class="bg"/><text x="60" y="58" class="title">PD-005 · COSTUME LAYER + MOVEMENT BOARD 0.1</text><text x="60" y="92" class="warn">[INTERPRETATION] · NOT EXACT SANGAM DRESS · SR-011 OPEN</text>
  <rect x="55" y="130" width="1490" height="310" rx="12" class="panel"/><text x="80" y="170" class="head">LAYER STACK · L0–L7</text>
  <g transform="translate(90,195)"><rect width="125" height="65" class="accent"/><text x="43" y="40" class="code">L0</text><rect x="150" width="125" height="65" class="accent"/><text x="193" y="40" class="code">L1</text><rect x="300" width="125" height="65" class="accent"/><text x="343" y="40" class="code">L2</text><rect x="450" width="125" height="65" class="accent"/><text x="493" y="40" class="code">L3</text><rect x="600" width="125" height="65" class="accent"/><text x="643" y="40" class="code">L4</text><rect x="750" width="125" height="65" class="accent"/><text x="793" y="40" class="code">L5</text><rect x="900" width="125" height="65" class="accent"/><text x="943" y="40" class="code">L6</text><rect x="1050" width="125" height="65" class="accent"/><text x="1093" y="40" class="code">L7</text></g>
  <text x="90" y="300" class="body">body / grooming</text><text x="240" y="300" class="body">primary drape</text><text x="390" y="300" class="body">secondary wrap</text><text x="540" y="300" class="body">secure / tie</text><text x="690" y="300" class="body">work layer</text><text x="840" y="300" class="body">status layer</text><text x="990" y="300" class="body">flowers</text><text x="1140" y="300" class="body">role change</text>
  <text x="90" y="360" class="warn">Every layer must explain movement, labour, climate or narrative function.</text><text x="90" y="397" class="body">No hidden modern fastening, exact dye/fibre claim, fixed robe colour or universal garment package.</text>
  <rect x="55" y="470" width="1490" height="390" rx="12" class="panel"/><text x="80" y="510" class="head">COSTUME FAMILIES + REQUIRED MOVEMENT</text>
  <text x="90" y="555" class="body">C1 Harbour: lift · squat · carry · wet edge</text><text x="805" y="555" class="body">C5 Teacher/ascetic: walk · sit · alms · weather</text>
  <text x="90" y="600" class="body">C2 Merchant: account · receive · store · display</text><text x="805" y="600" class="body">C6 Public service: carry · serve · wash · protect</text>
  <text x="90" y="645" class="body">C3 Performance: turn · floor · breath · sound</text><text x="805" y="645" class="body">C7 Travel/island: salt · wind · sleep · re-drape</text>
  <text x="90" y="690" class="body">C4 Royal: procedure · seated access · thresholds</text><text x="805" y="690" class="body">C8 Famine/repair: alter · patch · sell · reuse</text>
  <line x1="780" y1="530" x2="780" y2="735" class="line"/><text x="90" y="765" class="warn">M1–M8 TEST GATE:</text><text x="290" y="765" class="body">walk · floor · work · weather · crowd · sound · continuity · anachronism camera test</text>
  <text x="90" y="815" class="warn">NO:</text><text x="145" y="815" class="body">Bharatanatyam fan · bridal Manimekalai · generic nun · imperial Chola default · “exact Sangam dress”</text>
  <text x="1280" y="930" class="small">PD-005 / BOARD 0.1</text>
</svg>
