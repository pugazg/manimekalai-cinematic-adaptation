<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PD-006 Ornament Material and Movement Board</title><desc id="desc">Interpretive ornament material possibilities and movement controls, not a complete exact costume set.</desc>
  <defs><style>.bg{fill:#201e28}.panel{fill:#312e3b;stroke:#8c8797;stroke-width:2}.title{font:700 34px Arial;fill:#f2e5c1}.head{font:700 22px Arial;fill:#f2e5c1}.body{font:16px Arial;fill:#e2dfdf}.warn{font:700 19px Arial;fill:#e6a16b}.small{font:14px Arial;fill:#bbb7c1}.disk{stroke:#d8c9a5;stroke-width:3}.code{font:700 16px Arial;fill:#fff;text-anchor:middle}</style></defs>
  <rect width="1600" height="1000" class="bg"/><text x="60" y="58" class="title">PD-006 · ORNAMENT MATERIAL + MOVEMENT BOARD 0.1</text><text x="60" y="92" class="warn">[INTERPRETATION] · MATERIAL POSSIBILITY IS NOT A COMPLETE COSTUME SET · SR-011 OPEN</text>
  <rect x="55" y="130" width="1490" height="330" rx="12" class="panel"/><text x="80" y="170" class="head">MATERIAL FAMILIES · O1–O8</text>
  <g transform="translate(125,235)"><circle r="48" fill="#ded4ba" class="disk"/><text y="6" class="code">O1</text><circle cx="175" r="48" fill="#4f8d95" class="disk"/><text x="175" y="6" class="code">O2</text><circle cx="350" r="48" fill="#a55f48" class="disk"/><text x="350" y="6" class="code">O3</text><circle cx="525" r="48" fill="#b76c42" class="disk"/><text x="525" y="6" class="code">O4</text><circle cx="700" r="48" fill="#658481" class="disk"/><text x="700" y="6" class="code">O5</text><circle cx="875" r="48" fill="#b9923f" class="disk"/><text x="875" y="6" class="code">O6</text><circle cx="1050" r="48" fill="#8b6e8c" class="disk"/><text x="1050" y="6" class="code">O7</text><circle cx="1225" r="48" fill="#77718d" class="disk"/><text x="1225" y="6" class="code">O8</text></g>
  <text x="95" y="325" class="body">shell</text><text x="270" y="325" class="body">glass</text><text x="440" y="325" class="body">terracotta</text><text x="615" y="325" class="body">stone</text><text x="790" y="325" class="body">copper</text><text x="965" y="325" class="body">gold</text><text x="1120" y="325" class="body">flower/fibre</text><text x="1300" y="325" class="body">mixed/inherited</text>
  <text x="90" y="390" class="warn">Surface requirement:</text><text x="285" y="390" class="body">cutting · drilling · firing · growth lines · repair · oxidation · decay · handmade variation</text>
  <text x="90" y="425" class="body">No material automatically proves gender, rank, virtue, sexuality, caste, ethnicity or ritual meaning.</text>
  <rect x="55" y="490" width="720" height="360" rx="12" class="panel"/><text x="80" y="530" class="head">PROP RECORD · P1–P8</text>
  <text x="90" y="575" class="body">P1 evidence + uncertainty</text><text x="420" y="575" class="body">P5 movement / snag risk</text><text x="90" y="620" class="body">P2 fabrication hypothesis</text><text x="420" y="620" class="body">P6 sound signature</text><text x="90" y="665" class="body">P3 wearer / scene / purpose</text><text x="420" y="665" class="body">P7 stunt / safety duplicate</text><text x="90" y="710" class="body">P4 attachment / release</text><text x="420" y="710" class="body">P8 continuity state</text>
  <text x="90" y="785" class="warn">Every hero ornament must have a complete record.</text>
  <rect x="825" y="490" width="720" height="360" rx="12" class="panel"/><text x="850" y="530" class="head">MOVEMENT + SOUND · T1–T8</text>
  <text x="860" y="575" class="body">T1 wrist material sound</text><text x="1190" y="575" class="body">T5 crowd removal</text><text x="860" y="620" class="body">T2 turn / hair / ear</text><text x="1190" y="620" class="body">T6 water / salt</text><text x="860" y="665" class="body">T3 floor / impact / snag</text><text x="1190" y="665" class="body">T7 removal / gaze</text><text x="860" y="710" class="body">T4 occupation / work</text><text x="1190" y="710" class="body">T8 close-camera wear</text>
  <text x="860" y="785" class="warn">No standardized temple-jewellery or all-gold court.</text>
  <text x="70" y="910" class="warn">PUBLICITY PROHIBITION:</text><text x="310" y="910" class="body">never call a tested set “exact ancient jewellery.”</text><text x="1300" y="955" class="small">PD-006 / BOARD 0.1</text>
</svg>
